name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  headless-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang & latest VerBose-Lang compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang curl
          curl -fsSL https://github.com/thetrung/verbose-lang/releases/latest/download/verbose-linux-x86_64 -o /tmp/verbose
          chmod +x /tmp/verbose
          sudo mv /tmp/verbose /usr/local/bin/verbose
          verbose --version

      - name: Run headless ABI, math & demo verification
        run: make test
